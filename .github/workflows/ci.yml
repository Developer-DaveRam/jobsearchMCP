name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/production-audit"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build MCP server
        run: npm run build:mcp
      - name: Build dashboard
        run: npm run build
